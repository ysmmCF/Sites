<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seleção ADM | Little Farm</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

:root {
  --roxo: #8b3dff;
  --rosa: #ff4fd8;
  --rosa-claro: #ff8de1;
  --roxo-claro: #c084ff;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background: linear-gradient(135deg, #ff8de1, #c084ff, #8b3dff, #ff4fd8);
  background-size: 400% 400%;
  animation: gradienteAnimado 12s ease infinite;
  overflow-x:hidden;
  position:relative;
}

@keyframes gradienteAnimado {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Partículas de fundo - BOLINHAS SAINDO DE BAIXO */
.particula {
  position: fixed;
  bottom: -20px;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;
  pointer-events: none;
  animation: subir linear infinite;
  box-shadow: 0 0 15px rgba(255,255,255,0.4);
}

@keyframes subir {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: 1; }
  100% {
    transform: translateY(-120vh) rotate(360deg);
    opacity: 0;
  }
}

.container{
  width:100%;
  max-width:680px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(15px);
  border-radius: 30px;
  padding: 40px 35px;
  border: 1.5px solid rgba(255,255,255,0.3);
  box-shadow: 0 8px 32px rgba(139, 61, 255, 0.3), inset 0 0 20px rgba(255,255,255,0.1);
  animation: entrada 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

@keyframes entrada{
  from{ opacity:0; transform: translateY(40px) scale(0.95); }
  to{ opacity:1; transform: translateY(0) scale(1); }
}

/* Barra de progresso ARRASADA! */
.progresso-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 30px 30px 0 0;
  overflow: hidden;
}

.progresso {
  height: 100%;
  background: linear-gradient(90deg, var(--rosa), var(--roxo), var(--rosa-claro));
  background-size: 200% 100%;
  animation: brilhoProgresso 2s ease infinite;
  width: 0%;
  transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 20px var(--rosa);
  position: relative;
}

.progresso::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
  animation: shimmer 1.5s ease infinite;
}

@keyframes brilhoProgresso {
  0%, 100% { box-shadow: 0 0 15px var(--rosa), 0 0 30px var(--roxo); }
  50% { box-shadow: 0 0 25px var(--rosa), 0 0 50px var(--roxo); }
}

@keyframes shimmer {
  0% { background-position: -100% 0; }
  100% { background-position: 200% 0; }
}

.progresso-texto {
  position: absolute;
  top: 12px;
  right: 20px;
  color: white;
  font-size: 13px;
  font-weight: 700;
  opacity: 0.95;
  text-shadow: 0 0 8px rgba(255,255,255,0.6);
  z-index: 10;
}

.topo{
  text-align:center;
  margin-bottom:35px;
}

.emoji{
  font-size:70px;
  margin-bottom:10px;
  display: inline-block;
  animation: flutuar 3s ease-in-out infinite;
  cursor: pointer;
  transition: 0.3s;
  filter: drop-shadow(0 5px 15px rgba(255,255,255,0.5));
}

.emoji:hover { transform: scale(1.2) rotate(15deg); }

@keyframes flutuar{
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(5deg); }
}

.topo h1{
  color: white;
  font-size: 38px;
  font-weight: 700;
  margin-bottom: 8px;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
}

.topo p{
  color: white;
  opacity: 0.95;
  font-size: 16px;
  font-weight: 600;
}

.campo{
  margin-bottom: 24px;
  opacity: 0;
  transform: translateX(-30px);
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.campo.aparecer{
  opacity: 1;
  transform: translateX(0px);
}

label{
  display: block;
  margin-bottom: 10px;
  color: white;
  font-weight: 600;
  font-size: 15px;
}

.input-wrapper { position: relative; }

.input-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  opacity: 0.7;
  transition: 0.3s;
  pointer-events: none;
}

input, textarea, select{
  width: 100%;
  padding: 16px 18px 16px 50px;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  outline: none;
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 15px;
  transition: 0.3s;
}

textarea { padding-top: 16px; min-height: 120px; resize: vertical; }

input::placeholder, textarea::placeholder{ color: rgba(255,255,255,0.6); }

input:focus, textarea:focus, select:focus{
  border-color: var(--rosa);
  background: rgba(255,255,255,0.25);
  box-shadow: 0 0 0 4px rgba(255, 79, 216, 0.2), 0 8px 20px rgba(255, 79, 216, 0.3);
  transform: translateY(-2px);
}

input:focus ~ .input-icon, textarea:focus ~ .input-icon, select:focus ~ .input-icon {
  opacity: 1;
  transform: translateY(-50%) scale(1.2);
}

input.valido, textarea.valido, select.valido {
  border-color: #4ade80;
  background: rgba(74, 222, 128, 0.2);
}

input.invalido, textarea.invalido, select.invalido {
  border-color: #f87171;
  background: rgba(248, 113, 113, 0.2);
  animation: shake 0.4s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.contador {
  text-align: right;
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  margin-top: 5px;
}

.botao{
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 18px;
  background: linear-gradient(90deg, var(--rosa), var(--roxo));
  color: white;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 10px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(255, 79, 216, 0.4);
}

.botao::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: 0.5s;
}

.botao:hover::before { left: 100%; }
.botao:hover{ transform: translateY(-3px); box-shadow: 0 12px 35px rgba(255, 79, 216, 0.6); }
.botao:active { transform: translateY(0); }

.botao.desabilitado {
  background: rgba(255,255,255,0.3);
  cursor: not-allowed;
  opacity: 0.5;
}

.rodape{
  text-align: center;
  margin-top: 25px;
  color: white;
  opacity: 0.9;
  font-size: 13px;
  font-weight: 600;
}

@keyframes confete {
  0% { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 720px) {
  .container { padding: 35px 25px; max-width: 100%; }
  .topo h1 { font-size: 32px; }
  .emoji { font-size: 60px; }
}
</style>
</head>
<body>

<div class="container" id="container">
  <!-- Barra de progresso ARRASADA -->
  <div class="progresso-container">
    <div class="progresso" id="progresso"></div>
  </div>
  <div class="progresso-texto" id="progressoTexto">0%</div>
  
  <div class="topo">
    <div class="emoji">👑</div>
    <h1>Seleção de ADM</h1>
    <p>Preencha o formulário para participar da equipe Little Farm ✨</p>
  </div>

  <form id="formADM" onsubmit="enviarWhats(event)">
    <div class="campo">
      <label>🌸 Qual é o seu nome?</label>
      <div class="input-wrapper">
        <input type="text" id="nome" placeholder="Digite seu nome completo" required>
        <span class="input-icon">🌸</span>
      </div>
    </div>

    <div class="campo">
      <label>🎂 Qual é a sua idade?</label>
      <div class="input-wrapper">
        <input type="number" id="idade" placeholder="Digite sua idade" min="10" max="99" required>
        <span class="input-icon">🎂</span>
      </div>
    </div>

    <div class="campo">
      <label>📱 Qual seu número de telefone?</label>
      <div class="input-wrapper">
        <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
        <span class="input-icon">📱</span>
      </div>
    </div>

    <div class="campo">
      <label>👑 Por que você quer ser ADM?</label>
      <div class="input-wrapper">
        <textarea id="motivo" placeholder="Conte pra gente por que você quer essa posição..." maxlength="500" required></textarea>
        <span class="input-icon" style="top: 25px;">👑</span>
      </div>
      <div class="contador"><span id="contadorMotivo">0</span>/500</div>
    </div>

    <div class="campo">
      <label>💡 O que faria sendo ADM?</label>
      <div class="input-wrapper">
        <textarea id="adm" placeholder="Compartilhe suas ideias e planos..." maxlength="500" required></textarea>
        <span class="input-icon" style="top: 25px;">💡</span>
      </div>
      <div class="contador"><span id="contadorAdm">0</span>/500</div>
    </div>

    <div class="campo">
      <label>🕒 Quais horários você tem disponíveis?</label>
      <div class="input-wrapper">
        <input type="text" id="horario" placeholder="Ex: manhã, tarde e noite" required>
        <span class="input-icon">🕒</span>
      </div>
    </div>

    <div class="campo">
      <label>⭐ Já foi ADM antes?</label>
      <div class="input-wrapper">
        <select id="experiencia" required>
          <option value="">Selecione uma opção</option>
          <option>Sim</option>
          <option>Não</option>
        </select>
        <span class="input-icon">⭐</span>
      </div>
    </div>

    <div class="campo">
      <label>🎮 Quanto tempo fica online por dia?</label>
      <div class="input-wrapper">
        <input type="text" id="online" placeholder="Ex: 5 horas">
        <span class="input-icon">🎮</span>
      </div>
    </div>

    <div class="campo">
      <label>🎮 Quanto tempo você joga Flee the Facility?</label>
      <div class="input-wrapper">
        <input type="text" id="flee_time" placeholder="Ex: 2 anos, 6 meses...">
        <span class="input-icon">🎮</span>
      </div>
    </div>

    <div class="campo">
      <label>🎂 Qual a data do seu aniversário?</label>
      <div class="input-wrapper">
        <input type="text" id="aniversario" placeholder="Ex: 15/03/2005">
        <span class="input-icon">🎂</span>
      </div>
    </div>

    <div class="campo">
      <label>📚 Ainda estuda? se sim, em que série/ano você está?</label>
      <div class="input-wrapper">
        <input type="text" id="estudo" placeholder="Ex: Sim, 9º ano / Não, já conclui">
        <span class="input-icon">📚</span>
      </div>
    </div>

    <div class="campo">
      <label>💜 A quanto tempo está na comunidade Little Farm?</label>
      <div class="input-wrapper">
        <input type="text" id="tempo_comunidade" placeholder="Ex: 1 ano, 6 meses, 2 semanas...">
        <span class="input-icon">💜</span>
      </div>
    </div>

    <button class="botao desabilitado" type="submit" id="botaoSubmit">
      Enviar Formulário ✨
    </button>
  </form>

  <div class="rodape">💜 Little Farm • Recrutamento Oficial</div>
</div>

<script>
// BOLINHAS DE FUNDO - saindo de baixo pra cima!
function criarParticulas() {
  for(let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.classList.add('particula');
    p.style.left = Math.random() * 100 + '%';
    p.style.width = Math.random() * 8 + 4 + 'px';
    p.style.height = p.style.width;
    p.style.animationDuration = Math.random() * 10 + 10 + 's';
    p.style.animationDelay = Math.random() * 8 + 's';
    document.body.appendChild(p);
  }
}
criarParticulas();

// Animação de entrada dos campos
const campos = document.querySelectorAll('.campo');
campos.forEach((campo, i) => {
  setTimeout(() => campo.classList.add('aparecer'), i * 120);
});

// BARRA DE PROGRESSO ARRASADA - preenche conforme responde + valida!
const inputs = document.querySelectorAll('input, textarea, select');
const progresso = document.getElementById('progresso');
const progressoTexto = document.getElementById('progressoTexto');
const botaoSubmit = document.getElementById('botaoSubmit');

function atualizarProgresso() {
  let preenchidos = 0;
  let todosValidos = true;
  
  inputs.forEach(input => {
    const valor = input.value.trim();
    if(valor !== '') {
      preenchidos++;
      input.classList.add('valido');
      input.classList.remove('invalido');
    } else {
      input.classList.remove('valido');
      if(input.hasAttribute('required')) {
        input.classList.add('invalido');
        todosValidos = false;
      }
    }
  });
  
  const porcentagem = Math.round((preenchidos / inputs.length) * 100);
  progresso.style.width = porcentagem + '%';
  progressoTexto.textContent = porcentagem + '%';
  
  if(todosValidos && porcentagem === 100) {
    botaoSubmit.classList.remove('desabilitado');
  } else {
    botaoSubmit.classList.add('desabilitado');
  }
}

inputs.forEach(input => {
  input.addEventListener('input', atualizarProgresso);
  input.addEventListener('blur', atualizarProgresso);
});

// Máscara telefone
document.getElementById('telefone').addEventListener('input', function(e) {
  let v = e.target.value.replace(/D/g, '');
  v = v.replace(/^(d{2})(d)/g, '($1) $2');
  v = v.replace(/(d)(d{4})$/, '$1-$2');
  e.target.value = v;
});

// Contador de caracteres
document.getElementById('motivo').addEventListener('input', function() {
  document.getElementById('contadorMotivo').textContent = this.value.length;
});
document.getElementById('adm').addEventListener('input', function() {
  document.getElementById('contadorAdm').textContent = this.value.length;
});

// Confete
function soltarConfete() {
  for(let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.style.position = 'fixed';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = '-10px';
    c.style.width = '10px';
    c.style.height = '10px';
    c.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
    c.style.borderRadius = '50%';
    c.style.animation = `confete ${Math.random() * 2 + 2}s linear`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

// Enviar WhatsApp
function enviarWhats(event){
  event.preventDefault();
  
  const form = document.getElementById('formADM');
  if(!form.checkValidity()) {
    navigator.vibrate && navigator.vibrate(200);
    form.reportValidity();
    return;
  }

  soltarConfete();
  
  let mensagem = `✨ NOVA INSCRIÇÃO ADM ✨

🌸 Nome: ${document.getElementById('nome').value}
🎂 Idade: ${document.getElementById('idade').value}
📱 Telefone: ${document.getElementById('telefone').value}

👑 Quer ser ADM porque:
${document.getElementById('motivo').value}

💡 O que faria sendo ADM:
${document.getElementById('adm').value}

🕒 Horários: ${document.getElementById('horario').value}
⭐ Já foi ADM? ${document.getElementById('experiencia').value}
🎮 Tempo online: ${document.getElementById('online').value || 'Não informado'}

🎮 Tempo jogando Flee: ${document.getElementById('flee_time').value || 'Não informado'}
🎂 Aniversário: ${document.getElementById('aniversario').value || 'Não informado'}
📚 Estuda/Série: ${document.getElementById('estudo').value || 'Não informado'}
💜 Tempo na comunidade: ${document.getElementById('tempo_comunidade').value || 'Não informado'}`;

  window.open(`https://wa.me/5521966178536?text=${encodeURIComponent(mensagem)}`, "_blank");
}
</script>
</body>
</html>
