<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Seleção ADM</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;

  background:
  linear-gradient(
  135deg,
  #ff8de1,
  #c084ff,
  #8b5dff
  );

  overflow-y:auto;
}

/* container */

.container{

  width:100%;
  max-width:600px;

  background:
  rgba(255,255,255,0.15);

  backdrop-filter:blur(10px);

  border-radius:30px;

  padding:30px;

  border:
  1px solid rgba(255,255,255,0.2);

  box-shadow:
  0 0 20px rgba(255,255,255,0.2);

  animation:entrada 1s ease;
}

/* animação entrada */

@keyframes entrada{

  from{
    opacity:0;
    transform:
    translateY(30px);
  }

  to{
    opacity:1;
    transform:
    translateY(0px);
  }

}

/* topo */

.topo{
  text-align:center;
  margin-bottom:30px;
}

.emoji{

  font-size:60px;

  margin-bottom:10px;

  animation:
  flutuar 2s infinite alternate;
}

@keyframes flutuar{

  from{
    transform:translateY(0px);
  }

  to{
    transform:translateY(-8px);
  }

}

.topo h1{

  color:white;

  font-size:34px;

  margin-bottom:10px;
}

.topo p{

  color:white;

  opacity:0.9;

  font-size:14px;
}

/* perguntas */

.campo{

  margin-bottom:22px;

  opacity:0;

  transform:
  translateY(40px);

  transition:
  all 0.8s ease;
}

.campo.aparecer{

  opacity:1;

  transform:
  translateY(0px);
}

label{

  display:block;

  margin-bottom:8px;

  color:white;

  font-weight:bold;
}

input,
textarea,
select{

  width:100%;

  padding:15px;

  border:none;

  border-radius:18px;

  outline:none;

  background:
  rgba(255,255,255,0.2);

  color:white;

  font-size:15px;

  transition:0.3s;
}

input::placeholder,
textarea::placeholder{

  color:
  rgba(255,255,255,0.8);
}

input:focus,
textarea:focus,
select:focus{

  transform:scale(1.02);

  background:
  rgba(255,255,255,0.28);
}

textarea{

  resize:none;

  min-height:110px;
}

/* botão */

.botao{

  width:100%;

  padding:18px;

  border:none;

  border-radius:20px;

  background:
  linear-gradient(
  90deg,
  #ff4fd8,
  #8b3dff
  );

  color:white;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;

  transition:0.3s;

  margin-top:10px;
}

.botao:hover{

  transform:scale(1.03);

  box-shadow:
  0 0 20px #ff73e6;
}

/* rodapé */

.rodape{

  text-align:center;

  margin-top:20px;

  color:white;

  opacity:0.8;

  font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<div class="topo">

<div class="emoji">
👑
</div>

<h1>
Seleção de ADM
</h1>

<p>
Equipe Little Farm 💜
</p>

</div>

<form
onsubmit="enviarWhats(event)">

<div class="campo">

<label>
🌸 Qual é o seu nome?
</label>

<input
type="text"
id="nome"
placeholder="Digite seu nome"
required>

</div>

<div class="campo">

<label>
🎂 Qual é a sua idade?
</label>

<input
type="number"
id="idade"
placeholder="Digite sua idade"
required>

</div>

<div class="campo">

<label>
📱 Seu número de telefone
</label>

<input
type="tel"
id="telefone"
placeholder="(00) 00000-0000"
required>

</div>

<div class="campo">

<label>
👑 Por que você quer ser ADM?
</label>

<textarea
id="motivo"
placeholder="Explique aqui..."
required></textarea>

</div>

<div class="campo">

<label>
💡 O que faria sendo ADM?
</label>

<textarea
id="adm"
placeholder="Conte suas ideias..."
required></textarea>

</div>

<div class="campo">

<label>
🕒 Quais horários você tem disponíveis?
</label>

<textarea
id="horario"
placeholder="Ex: manhã, tarde e noite"
required></textarea>

</div>

<div class="campo">

<label>
⭐ Já foi ADM antes?
</label>

<select
id="experiencia"
required>

<option value="">
Selecione
</option>

<option>
Sim
</option>

<option>
Não
</option>

</select>

</div>

<div class="campo">

<label>
🎮 Quanto tempo fica online?
</label>

<input
type="text"
id="online"
placeholder="Ex: 5 horas">

</div>

<button
class="botao"
type="submit">

Enviar Formulário ✨

</button>

</form>

<div class="rodape">

Obrigada por participar 💜

</div>

</div>

<script>

/* animação perguntas */

const campos =
document.querySelectorAll('.campo');

function revelarCampos(){

  const alturaTela =
  window.innerHeight;

  campos.forEach((campo)=>{

    const topoCampo =
    campo.getBoundingClientRect().top;

    if(
      topoCampo <
      alturaTela - 80
    ){

      campo.classList.add(
      'aparecer'
      );

    }

  });

}

window.addEventListener(
'scroll',
revelarCampos
);

window.addEventListener(
'load',
revelarCampos
);

/* enviar whatsapp */

function enviarWhats(event){

event.preventDefault();

let nome =
document.getElementById(
'nome'
).value;

let idade =
document.getElementById(
'idade'
).value;

let telefone =
document.getElementById(
'telefone'
).value;

let motivo =
document.getElementById(
'motivo'
).value;

let adm =
document.getElementById(
'adm'
).value;

let horario =
document.getElementById(
'horario'
).value;

let experiencia =
document.getElementById(
'experiencia'
).value;

let online =
document.getElementById(
'online'
).value;

let mensagem =
`✨ NOVA INSCRIÇÃO ADM ✨

🌸 Nome:
${nome}

🎂 Idade:
${idade}

📱 Telefone:
${telefone}

👑 Quer ser ADM porque:
${motivo}

💡 O que faria sendo ADM:
${adm}

🕒 Horários disponíveis:
${horario}

⭐ Já foi ADM antes?
${experiencia}

🎮 Tempo online:
${online}`;

let numero =
"5521966178536";

let link =
`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

window.open(
link,
"_blank"
);

}

</script>

</body>
  </html>
