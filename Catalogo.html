<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo | DUDA BUQUÊS</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f7f1ff;
      --white: #ffffff;
      --text: #24152e;
      --muted: #6a5b76;

      --purple: #7c3aed;
      --purple2: #5b21b6;

      --shadow: 0 20px 50px rgba(0,0,0,.08);
      --shadow2: 0 12px 30px rgba(0,0,0,.10);

      --radius: 26px;
      --max: 1200px;
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #ffffff 0%, var(--bg) 55%, #ffffff 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    a{text-decoration:none;color:inherit;}
    button{font-family: inherit;}

    header{
      position: sticky;
      top: 0;
      z-index: 999;
      backdrop-filter: blur(18px);
      background: rgba(247, 241, 255, 0.75);
      border-bottom: 1px solid rgba(0,0,0,.05);
    }

    .nav{
      max-width: var(--max);
      margin: auto;
      padding: 16px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 18px;
    }

    .logo{
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      letter-spacing: .5px;
      font-weight: 700;
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .logo span{
      color: var(--purple2);
    }

    nav{
      display:flex;
      align-items:center;
      gap: 18px;
    }

    nav a{
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      transition: .25s;
      position: relative;
    }

    nav a:hover{
      color: var(--text);
    }

    nav a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-6px;
      width:0%;
      height:2px;
      background: linear-gradient(90deg, var(--purple), var(--purple2));
      transition:.25s;
      border-radius: 10px;
    }

    nav a:hover::after{
      width:100%;
    }

    .btn{
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: .25s;
      font-weight: 700;
      font-size: 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
    }

    .btn-primary{
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      color: white;
      box-shadow: 0 12px 25px rgba(124, 58, 237, .35);
    }

    .btn-primary:hover{
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(124, 58, 237, .45);
    }

    .btn-outline{
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(0,0,0,.08);
      color: var(--text);
    }

    .btn-outline:hover{
      background: white;
      transform: translateY(-2px);
      box-shadow: var(--shadow2);
    }

    .cart-count{
      background: var(--purple2);
      color: white;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 800;
      min-width: 26px;
      text-align:center;
    }

    section{
      max-width: var(--max);
      margin: auto;
      padding: 60px 20px;
    }

    .title{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .title h1{
      font-family: 'Playfair Display', serif;
      font-size: 46px;
    }

    .title p{
      color: var(--muted);
      max-width: 580px;
      line-height: 1.6;
      font-size: 15px;
    }

    .products{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product{
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.07);
      transition: .25s;
      display:flex;
      flex-direction: column;
    }

    .product:hover{
      transform: translateY(-6px);
      box-shadow: 0 28px 70px rgba(0,0,0,.10);
    }

    .product img{
      width:100%;
      height: 250px;
      object-fit: cover;
    }

    .product-content{
      padding: 18px 18px 16px;
      display:flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .product-content h3{
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.2px;
    }

    .product-content p{
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      flex: 1;
    }

    .product-footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .price{
      font-weight: 900;
      font-size: 16px;
      color: var(--purple2);
    }

    .tag{
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(124, 58, 237, .12);
      color: var(--purple2);
      font-weight: 800;
    }

    /* LOADING */
    .loading{
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      padding: 30px 0;
    }

    /* MODAL */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 9999;
      padding: 18px;
    }

    .modal.active{
      display:flex;
    }

    .modal-box{
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
      overflow:hidden;
      animation: pop .25s ease;
    }

    @keyframes pop{
      from{transform: scale(.95); opacity: 0;}
      to{transform: scale(1); opacity: 1;}
    }

    .modal-header{
      padding: 18px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom: 1px solid rgba(0,0,0,.06);
    }

    .modal-header h3{
      font-size: 18px;
      font-weight: 900;
    }

    .close{
      cursor:pointer;
      font-size: 20px;
      background: none;
      border: none;
      font-weight: 900;
      color: var(--muted);
    }

    .modal-body{
      padding: 18px;
      display:flex;
      flex-direction: column;
      gap: 14px;
      max-height: 55vh;
      overflow:auto;
    }

    .cart-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.7);
    }

    .cart-item img{
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(0,0,0,.05);
    }

    .cart-item-info{
      flex: 1;
      display:flex;
      flex-direction: column;
      gap: 2px;
    }

    .cart-item-info strong{
      font-size: 14px;
    }

    .cart-item-info span{
      font-size: 13px;
      color: var(--muted);
    }

    .remove{
      border:none;
      background: rgba(255, 0, 0, .10);
      color: #b00020;
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      font-weight: 800;
      font-size: 12px;
      transition:.2s;
    }

    .remove:hover{
      background: rgba(255, 0, 0, .18);
    }

    .modal-footer{
      padding: 18px;
      border-top: 1px solid rgba(0,0,0,.06);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .total{
      font-size: 16px;
      font-weight: 900;
    }

    /* WhatsApp floating */
    .whatsapp{
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      color: white;
      border-radius: 999px;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      gap: 10px;
      font-weight: 900;
      box-shadow: 0 18px 45px rgba(124, 58, 237, .35);
      z-index: 999;
      transition: .25s;
    }

    .whatsapp:hover{
      transform: translateY(-4px);
    }

    @media(max-width: 980px){
      .products{
        grid-template-columns: 1fr 1fr;
      }
    }

    @media(max-width: 580px){
      nav{
        display:none;
      }
      .products{
        grid-template-columns: 1fr;
      }
      .btn{
        width: 100%;
      }
      .title h1{
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav">
      <div class="logo">DUDA <span>BUQUÊS</span> 💜</div>

      <nav>
        <a href="index.html">Início</a>
        <a href="catalogoduda.html">Catálogo</a>
      </nav>

      <div class="nav-actions">
        <button class="btn btn-outline" onclick="openCart()">
          🛒 Carrinho <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <section>
    <div class="title">
      <div>
        <h1>Catálogo Premium</h1>
        <p>Escolha o seu buquê e finalize o pedido no WhatsApp. Simples, rápido e chique.</p>
      </div>
    </div>

    <div class="products" id="productGrid">
      <div class="loading">Carregando produtos... 💜</div>
    </div>
  </section>

  <footer style="text-align:center;padding:35px 20px;color:#6a5b76;">
    © 2026 DUDA BUQUÊS 💜
  </footer>

  <a class="whatsapp" href="#" onclick="openWhatsApp()">💜 WhatsApp</a>

  <!-- MODAL CART -->
  <div class="modal" id="cartModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Seu Carrinho</h3>
        <button class="close" onclick="closeCart()">✕</button>
      </div>

      <div class="modal-body" id="cartItems"></div>

      <div class="modal-footer">
        <div class="total" id="cartTotal">Total: R$ 0,00</div>
        <button class="btn btn-primary" onclick="checkoutWhatsApp()">📲 Finalizar no WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJok3QZOeXUz_ZWHqQEuahM2DvO9xdJ-WAWnkVCm3Xg6Y7_q8w_JM0VsWBsm9xbvvL/exec";
    let products = [];
    let cart = JSON.parse(localStorage.getItem("dudaCart")) || [];

    updateCartCount();

    function saveCart(){
      localStorage.setItem("dudaCart", JSON.stringify(cart));
    }

    function formatPrice(value){
      const number = Number(value);
      if(isNaN(number)) return "R$ 0,00";
      return number.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function normalizeProduct(p){
      return {
        id: Number(p.id),
        name: p.name || "Produto sem nome",
        desc: p.desc || "Buquê premium exclusivo DUDA BUQUÊS 💜",
        tag: p.tag || "Premium",
        price: Number(p.price),
        img: p.img || "https://via.placeholder.com/600x400?text=Sem+Imagem"
      };
    }

    async function loadProducts(){
      const grid = document.getElementById("productGrid");
      grid.innerHTML = `<div class="loading">Carregando produtos... 💜</div>`;

      try{
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();

        products = data.map(normalizeProduct);

        if(products.length === 0){
          grid.innerHTML = `<div class="loading">Nenhum produto cadastrado ainda 😭</div>`;
          return;
        }

        renderProducts();
      } catch(err){
        console.error(err);
        grid.innerHTML = `<div class="loading">Erro ao carregar produtos 😭💔</div>`;
      }
    }

    function renderProducts(){
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      products.forEach(p => {
        const card = document.createElement("div");
        card.className = "product";

        card.innerHTML = `
          <img src="${p.img}" alt="${p.name}">
          <div class="product-content">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
              <h3>${p.name}</h3>
              <span class="tag">${p.tag}</span>
            </div>
            <p>${p.desc}</p>
            <div class="product-footer">
              <span class="price">${formatPrice(p.price)}</span>
              <button class="btn btn-primary" onclick="addToCart(${p.id})">Adicionar</button>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function addToCart(id){
      const product = products.find(p => p.id === id);
      if(!product) return;

      cart.push(product);

      saveCart();
      updateCartCount();

      openCart();
      renderCart();
    }

    function removeFromCart(index){
      cart.splice(index, 1);

      saveCart();
      updateCartCount();

      renderCart();
    }

    function updateCartCount(){
      document.getElementById("cartCount").innerText = cart.length;
    }

    function renderCart(){
      const cartItems = document.getElementById("cartItems");
      const cartTotal = document.getElementById("cartTotal");

      cartItems.innerHTML = "";

      if(cart.length === 0){
        cartItems.innerHTML = `<p style="color:#6a5b76;font-size:14px;">Seu carrinho está vazio 😭💜</p>`;
        cartTotal.innerText = "Total: R$ 0,00";
        return;
      }

      let total = 0;

      cart.forEach((item, index) => {
        total += Number(item.price) || 0;

        const div = document.createElement("div");
        div.className = "cart-item";

        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <div class="cart-item-info">
            <strong>${item.name}</strong>
            <span>${formatPrice(item.price)}</span>
          </div>
          <button class="remove" onclick="removeFromCart(${index})">Remover</button>
        `;

        cartItems.appendChild(div);
      });

      cartTotal.innerText = "Total: " + formatPrice(total);
    }

    function openCart(){
      document.getElementById("cartModal").classList.add("active");
      renderCart();
    }

    function closeCart(){
      document.getElementById("cartModal").classList.remove("active");
    }

    function checkoutWhatsApp(){
      if(cart.length === 0){
        alert("Seu carrinho tá vazio 😅");
        return;
      }

      let message = "Olá! Quero fazer um pedido na DUDA BUQUÊS 💜💐%0A%0A";
      let total = 0;

      cart.forEach((item) => {
        message += `• ${item.name} - ${formatPrice(item.price)}%0A`;
        total += Number(item.price) || 0;
      });

      message += `%0A✨ Total: ${formatPrice(total)}%0A%0A`;
      message += "Quero combinar entrega e pagamento.";

      const phone = "5521970391276";
      window.open(`https://wa.me/${phone}?text=${message}`, "_blank");
    }

    function openWhatsApp(){
      const phone = "5521970391276";
      const message = "Olá! Quero encomendar um buquê na DUDA BUQUÊS 💜💐";
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, "_blank");
    }

    document.getElementById("cartModal").addEventListener("click", function(e){
      if(e.target.id === "cartModal"){
        closeCart();
      }
    });

    loadProducts();
    updateCartCount();
  </script>

</body>
</html>
